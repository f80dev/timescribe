name = "timescribe"
compatibility_date = "2026-09-20"
pages_build_output_dir = "./dist/timescribe/browser"

# Build (ADR-013 : Yarn 4 via Corepack, npm n'est plus supporté) :
#   corepack enable && yarn install --immutable && yarn run build
# Output : dist/timescribe/browser (Angular 22 + @angular/build:application)

# SPA fallback : le fichier public/_redirects gère le routing.
# Headers de sécurité de base (statiques via Cloudflare).

[build]
command = "corepack enable && yarn install --immutable && yarn run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
